# ==============================================================================
# Nginx Hardening Configuration Snippet (for Production Nginx + PHP-FPM Deployments)
# Include this block or incorporate into your server { ... } block in /etc/nginx/sites-available/
# ==============================================================================

# 1. Deny access to sensitive files and hidden directories
location ~* /\.(git|env|svn|hg) {
    deny all;
    return 404;
}

location ~* \.(sql|log|ini|md|bak|zip|env|example|sh|conf)$ {
    deny all;
    return 404;
}

# 2. Block direct web access to sensitive application folders
location ^~ /config/ {
    deny all;
    return 404;
}

location ^~ /sql/ {
    deny all;
    return 404;
}

location ^~ /logs/ {
    deny all;
    return 404;
}

# 3. Deny PHP execution inside user uploads
location ~* ^/uploads/.*\.php$ {
    deny all;
    return 404;
}

location ~* ^/master/assets/uploads/.*\.php$ {
    deny all;
    return 404;
}

