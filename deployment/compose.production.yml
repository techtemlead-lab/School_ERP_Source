name: ${ERP_PROJECT:-schoolmng}
x-app: &app
  image: ${ERP_IMAGE:?ERP_IMAGE required}
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=256m", "/var/run/apache2:rw,nosuid,size=16m", "/var/lock/apache2:rw,nosuid,size=16m"]
  security_opt: [no-new-privileges:true]
  pids_limit: 200
  mem_limit: 512m
  cpus: 1.0
  working_dir: /var/www/html
services:
  main-db:
    image: mariadb:11.4@sha256:70cc072b29b4a89ae07abb2d4da2c64678a7f2dfe092751bb51c87d67dc1338b
    restart: unless-stopped
    env_file: [./secrets/main-db.env]
    command: ["--innodb-buffer-pool-size=256M", "--max-connections=100"]
    volumes: [main_database:/var/lib/mysql]
    networks: [main_private]
    mem_limit: 768m
    healthcheck: {test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 10s, timeout: 5s, retries: 30}
  demo-db:
    image: mariadb:11.4@sha256:70cc072b29b4a89ae07abb2d4da2c64678a7f2dfe092751bb51c87d67dc1338b
    restart: unless-stopped
    env_file: [./secrets/demo-db.env]
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=80"]
    volumes: [demo_database:/var/lib/mysql]
    networks: [demo_private]
    mem_limit: 512m
    healthcheck: {test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 10s, timeout: 5s, retries: 30}
  main:
    <<: *app
    env_file: [./secrets/main.env]
    volumes:
      - ./shared/uploads:/var/www/html/uploads
      - ./shared/master-uploads:/var/www/html/master/assets/uploads
      - ./shared/logs:/var/www/html/logs
    depends_on: {main-db: {condition: service_healthy}}
    networks: [main_private, outbound]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Host: $$ERP_PRIMARY_HOST\" http://127.0.0.1/health.php >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s
  demo:
    <<: *app
    env_file: [./secrets/demo.env]
    volumes: [./shared/demo-uploads:/var/www/html/uploads]
    depends_on: {demo-db: {condition: service_healthy}}
    networks: [demo_private]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Host: $$ERP_DEMO_HOST\" http://127.0.0.1/health.php >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 120s
  worker:
    <<: *app
    user: root
    command: ["php", "cron/demo_worker.php"]
    env_file: [./secrets/worker.env]
    volumes: [./shared/demo-uploads:/var/www/html/uploads]
    depends_on: {demo-db: {condition: service_healthy}}
    networks: [demo_private]
    healthcheck: {test: ["CMD", "php", "cron/health_worker.php", "demo"], interval: 60s, timeout: 5s, retries: 3, start_period: 120s}
  provisioner:
    <<: *app
    command: ["php", "cron/provision_worker.php"]
    env_file: [./secrets/provisioner.env]
    depends_on: {main-db: {condition: service_healthy}}
    networks: [main_private]
    healthcheck: {test: ["CMD", "php", "cron/health_worker.php", "provisioner"], interval: 30s, timeout: 5s, retries: 3, start_period: 60s}
  bootstrap:
    <<: *app
    profiles: [tools]
    restart: "no"
    command: ["php", "cron/bootstrap_production.php"]
    env_file: [./secrets/bootstrap.env]
    volumes:
      - ./shared/uploads:/var/www/html/uploads
      - ./shared/master-uploads:/var/www/html/master/assets/uploads
      - ./private:/credentials
    networks: [main_private, demo_private]
  gateway:
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    restart: unless-stopped
    ports: ["127.0.0.1:${ERP_PORT:-18083}:8080"]
    volumes: [./nginx.gateway.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [main, demo]
    networks: [main_private, demo_private, outbound]
    mem_limit: 96m
    pids_limit: 100
    healthcheck: {test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/gateway-health"], interval: 20s, timeout: 5s, retries: 3}
volumes:
  main_database:
  demo_database:
networks:
  main_private: {internal: true}
  demo_private: {internal: true}
  outbound: {}
