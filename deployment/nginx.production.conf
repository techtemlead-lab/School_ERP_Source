server {
 listen 80; listen [::]:80;
 server_name schoolmng.techteamlead.com demo.schoolmng.techteamlead.com tawhaa.schoolmng.techteamlead.com;
 location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; try_files $uri =404; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl; listen [::]:443 ssl;
 server_name schoolmng.techteamlead.com demo.schoolmng.techteamlead.com tawhaa.schoolmng.techteamlead.com;
 ssl_certificate /etc/letsencrypt/live/schoolmng.techteamlead.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/schoolmng.techteamlead.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 12m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options SAMEORIGIN always;
 add_header Strict-Transport-Security "max-age=31536000" always;
 location ~ /\. { return 404; }
 location ~ ^/(config|sql|cron|tests|deployment|logs)(/|$) { return 404; }
 location ~* \.(sql|log|ini|md|bak|env|example|sh|conf|yml)$ { return 404; }
 location / {
  proxy_pass http://127.0.0.1:18083;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 120s;
 }
}
